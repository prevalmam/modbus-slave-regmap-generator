<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
<title id="title">上限と下限を、組合せで判定する</title>
<desc id="desc">MasterがAL_HIGH=100、AL_LOW=20を一括書込みする。下限が上限以下かをアプリが検証し、生成コードがOKまたはNG応答を返す。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#738597" stroke-width="1.7"/></marker></defs>
<rect width="1000" height="100%" fill="#ffffff"/>
<g font-family="Yu Gothic UI, Meiryo, sans-serif" fill="#172d43">
<text x="26" y="32" font-size="17" fill="#526477" font-weight="400" text-anchor="start">2.5 グループ検証</text>
<text x="26" y="72" font-size="29" fill="#172d43" font-weight="700" text-anchor="start">上限と下限を、組合せで判定する</text>
<text x="26" y="106" font-size="19" fill="#526477" font-weight="400" text-anchor="start">JSONで同じグループ名を指定。値を揃えて渡す配線は自動生成。</text>
<path d="M26 126 H974" fill="none" stroke="#dbe3eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="26" y="150" width="948" height="122" rx="12" fill="#eaf2ff" stroke="#5782b6" stroke-width="1.3"/>
<text x="44" y="179" font-size="16" fill="#234f82" font-weight="700" text-anchor="start">入力：Masterから一括書込み（Write Multiple Registers）</text>
<text x="44" y="214" font-size="25" fill="#172d43" font-weight="400" text-anchor="start">AL_HIGH = 100   /   AL_LOW = 20</text>
<path d="M500 278 L500 309" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="26" y="315" width="948" height="140" rx="12" fill="#fff7ed" stroke="#ea7b23" stroke-width="2.5"/>
<text x="44" y="344" font-size="19" fill="#994210" font-weight="700" text-anchor="start">自動生成：グループ内の値を収集 → そろった値をアプリへ</text>
<rect x="209" y="361" width="270" height="77" rx="7" fill="#eaf2ff" stroke="#5782b6" stroke-width="1"/>
<text x="223" y="384" font-size="16" fill="#234f82" font-weight="400" text-anchor="start">AL_HIGH</text>
<text x="344.0" y="421" font-size="28" fill="#234f82" font-weight="700" text-anchor="middle">100</text>
<rect x="523" y="361" width="270" height="77" rx="7" fill="#eaf2ff" stroke="#5782b6" stroke-width="1"/>
<text x="537" y="384" font-size="16" fill="#234f82" font-weight="400" text-anchor="start">AL_LOW</text>
<text x="658.0" y="421" font-size="28" fill="#234f82" font-weight="700" text-anchor="middle">20</text>
<path d="M500 461 L500 480" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="26" y="486" width="604" height="108" rx="12" fill="#effaf3" stroke="#429269" stroke-width="1.3"/>
<text x="44" y="515" font-size="16" fill="#22613e" font-weight="700" text-anchor="start">アプリ実装：組合せの検証</text>
<text x="44" y="550" font-size="25" fill="#172d43" font-weight="400" text-anchor="start">AL_LOW ≤ AL_HIGH</text>
<rect x="712" y="486" width="262" height="108" rx="12" fill="#fff7ed" stroke="#ea7b23" stroke-width="2.5"/>
<text x="730" y="515" font-size="16" fill="#994210" font-weight="700" text-anchor="start">自動生成：判定結果</text>
<text x="730" y="550" font-size="24" fill="#172d43" font-weight="400" text-anchor="start">OK / NG応答</text>
<path d="M636 544 L706 544" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="26" y="626" font-size="19" fill="#526477" font-weight="400" text-anchor="start">各レジスタのMin/Maxだけでは分からない「下限と上限の関係」をチェックする。</text>
</g>
</svg>
