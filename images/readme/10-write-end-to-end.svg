<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="882" viewBox="0 0 1000 882" role="img" aria-labelledby="title desc">
<title id="title">時刻書込みは「拒否 → 検証 → 反映 → 通知」</title>
<desc id="desc">Masterが日時を一括書込みする。busyならbusy例外で終了。値をグループとして揃え、アプリが日時を検証する。不正なら不正な値の例外で終了。成功時はRAM反映、OK応答の送信要求、更新コールバック、アプリによるRTC書込みの順に進む。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#738597" stroke-width="1.7"/></marker></defs>
<rect width="1000" height="100%" fill="#ffffff"/>
<g font-family="Yu Gothic UI, Meiryo, sans-serif" fill="#172d43">
<text x="26" y="32" font-size="17" fill="#526477" font-weight="400" text-anchor="start">2.9 拒否・検証・通知をつなぐ</text>
<text x="26" y="72" font-size="29" fill="#172d43" font-weight="700" text-anchor="start">時刻書込みは「拒否 → 検証 → 反映 → 通知」</text>
<text x="26" y="106" font-size="19" fill="#526477" font-weight="400" text-anchor="start">成功経路を上から下へ。拒否された書込みは右側で終了する。</text>
<path d="M26 126 H974" fill="none" stroke="#dbe3eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="26" y="151" width="560" height="84" rx="12" fill="#f3f6fa" stroke="#c9d4df" stroke-width="1.3"/>
<text x="44" y="180" font-size="16" fill="#172d43" font-weight="700" text-anchor="start">入力：Master</text>
<text x="44" y="215" font-size="21" fill="#172d43" font-weight="400" text-anchor="start">年・月・日・時・分・秒を一括書込み</text>
<path d="M306 241 L306 263" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="26" y="269" width="560" height="96" rx="12" fill="#fff7ed" stroke="#ea7b23" stroke-width="2.5"/>
<text x="44" y="298" font-size="16" fill="#994210" font-weight="700" text-anchor="start">① 自動生成：busy判定（2.3）</text>
<text x="44" y="333" font-size="23" fill="#172d43" font-weight="400" text-anchor="start">編集中で書込み拒否が有効か？</text>
<rect x="686" y="269" width="288" height="96" rx="12" fill="#fff7ed" stroke="#ea7b23" stroke-width="2.5"/>
<text x="704" y="298" font-size="16" fill="#994210" font-weight="700" text-anchor="start">自動生成：ここで終了</text>
<text x="704" y="333" font-size="23" fill="#172d43" font-weight="400" text-anchor="start">NG：busy</text>
<path d="M592 318 L680 318" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="636" y="302" font-size="17" fill="#9c302c" font-weight="400" text-anchor="middle">はい</text>
<path d="M306 371 L306 410" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="324" y="398" font-size="17" fill="#526477" font-weight="400" text-anchor="start">いいえ</text>
<rect x="26" y="416" width="560" height="126" rx="12" fill="#effaf3" stroke="#429269" stroke-width="1.3"/>
<text x="44" y="445" font-size="16" fill="#22613e" font-weight="700" text-anchor="start">② 自動生成で値を揃える → アプリで検証（2.6〜2.8）</text>
<text x="44" y="480" font-size="23" fill="#172d43" font-weight="400" text-anchor="start">日時として成立しているか？</text>
<text x="44" y="521" font-size="18" fill="#22613e" font-weight="400" text-anchor="start">日時の判定ロジックはアプリが実装</text>
<rect x="686" y="431" width="288" height="96" rx="12" fill="#fff7ed" stroke="#ea7b23" stroke-width="2.5"/>
<text x="704" y="460" font-size="16" fill="#994210" font-weight="700" text-anchor="start">自動生成：ここで終了</text>
<text x="704" y="495" font-size="23" fill="#172d43" font-weight="400" text-anchor="start">NG：不正な値</text>
<path d="M592 479 L680 479" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="636" y="463" font-size="17" fill="#9c302c" font-weight="400" text-anchor="middle">いいえ</text>
<path d="M306 548 L306 587" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="324" y="575" font-size="17" fill="#526477" font-weight="400" text-anchor="start">はい</text>
<rect x="26" y="593" width="560" height="96" rx="12" fill="#fff7ed" stroke="#ea7b23" stroke-width="2.5"/>
<text x="44" y="622" font-size="16" fill="#994210" font-weight="700" text-anchor="start">③ 自動生成：正常更新</text>
<text x="44" y="657" font-size="23" fill="#172d43" font-weight="400" text-anchor="start">RAMへ反映 → OK応答の送信要求</text>
<path d="M306 695 L306 722" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="26" y="728" width="560" height="96" rx="12" fill="#effaf3" stroke="#429269" stroke-width="1.3"/>
<text x="44" y="757" font-size="16" fill="#22613e" font-weight="700" text-anchor="start">④ アプリ実装：更新コールバック（2.4）</text>
<text x="44" y="792" font-size="23" fill="#172d43" font-weight="400" text-anchor="start">RTCへ実際に書き込む</text>
<text x="610" y="718" font-size="18" fill="#994210" font-weight="400" text-anchor="start">コールバックの呼出し配線は自動生成</text>
<text x="26" y="859" font-size="19" fill="#526477" font-weight="400" text-anchor="start">アプリが用意する中心部分は、日時の検証とRTCへの書込み処理。</text>
</g>
</svg>
