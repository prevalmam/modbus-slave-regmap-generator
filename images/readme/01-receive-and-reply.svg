<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">実機の入出力をつなげば、通信処理の核は自動生成</title>
<desc id="desc">Masterの書込みフレームをHALで受信し、自動生成コードがパース・CRC・アドレス・型・Min/Max検証、RAM反映、保存要通知、OKまたはNG応答生成を行う。HALが実際に送信する。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#738597" stroke-width="1.7"/></marker></defs>
<rect width="1000" height="100%" fill="#ffffff"/>
<g font-family="Yu Gothic UI, Meiryo, sans-serif" fill="#172d43">
<text x="26" y="32" font-size="17" fill="#526477" font-weight="400" text-anchor="start">2.1 受信から応答まで</text>
<text x="26" y="72" font-size="29" fill="#172d43" font-weight="700" text-anchor="start">実機の入出力をつなげば、通信処理の核は自動生成</text>
<text x="26" y="106" font-size="19" fill="#526477" font-weight="400" text-anchor="start">左から右へ。オレンジは自動生成、緑はアプリ実装。</text>
<path d="M26 126 H974" fill="none" stroke="#dbe3eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="26" y="164" width="178" height="187" rx="12" fill="#f3f6fa" stroke="#c9d4df" stroke-width="1.3"/>
<text x="44" y="193" font-size="16" fill="#172d43" font-weight="700" text-anchor="start">入力：Master</text>
<text x="44" y="228" font-size="22" fill="#172d43" font-weight="400" text-anchor="start">書込み</text>
<text x="44" y="258" font-size="22" fill="#172d43" font-weight="400" text-anchor="start">フレーム</text>
<rect x="240" y="164" width="180" height="187" rx="12" fill="#effaf3" stroke="#429269" stroke-width="1.3"/>
<text x="258" y="193" font-size="16" fill="#22613e" font-weight="700" text-anchor="start">アプリ実装</text>
<text x="258" y="228" font-size="20" fill="#172d43" font-weight="400" text-anchor="start">HALで受信</text>
<text x="258" y="258" font-size="20" fill="#172d43" font-weight="400" text-anchor="start">UART / RS-485</text>
<rect x="456" y="150" width="292" height="218" rx="12" fill="#fff7ed" stroke="#ea7b23" stroke-width="2.5"/>
<text x="474" y="179" font-size="16" fill="#994210" font-weight="700" text-anchor="start">自動生成</text>
<text x="474" y="214" font-size="19" fill="#172d43" font-weight="400" text-anchor="start">パース・CRC検証</text>
<text x="474" y="244" font-size="19" fill="#172d43" font-weight="400" text-anchor="start">アドレス・型・Min/Max</text>
<text x="474" y="274" font-size="19" fill="#172d43" font-weight="400" text-anchor="start">RAM反映・保存要通知</text>
<text x="474" y="304" font-size="19" fill="#172d43" font-weight="400" text-anchor="start">OK / NG応答を生成</text>
<rect x="784" y="164" width="190" height="187" rx="12" fill="#effaf3" stroke="#429269" stroke-width="1.3"/>
<text x="802" y="193" font-size="16" fill="#22613e" font-weight="700" text-anchor="start">アプリ実装</text>
<text x="802" y="228" font-size="20" fill="#172d43" font-weight="400" text-anchor="start">HALで送信</text>
<text x="802" y="258" font-size="20" fill="#172d43" font-weight="400" text-anchor="start">UART / RS-485</text>
<path d="M209 260 L234 260" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M425 260 L450 260" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M753 260 L778 260" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="26" y="408" font-size="19" fill="#526477" font-weight="400" text-anchor="start">受信・送信はアプリが実装。保存はスナップショットを回収して進める。</text>
</g>
</svg>
