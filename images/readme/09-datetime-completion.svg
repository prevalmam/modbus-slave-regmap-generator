<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
<title id="title">「分」だけを書いても、日時全体で判定</title>
<desc id="desc">Masterが分=42だけを書込み、年2026・月08・日18・時09・秒12をRAMから補う。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#738597" stroke-width="1.7"/></marker></defs>
<rect width="1000" height="100%" fill="#ffffff"/>
<g font-family="Yu Gothic UI, Meiryo, sans-serif" fill="#172d43">
<text x="26" y="32" font-size="17" fill="#526477" font-weight="400" text-anchor="start">2.8 グループ検証と値の補完</text>
<text x="26" y="72" font-size="29" fill="#172d43" font-weight="700" text-anchor="start">「分」だけを書いても、日時全体で判定</text>
<text x="26" y="106" font-size="19" fill="#526477" font-weight="400" text-anchor="start">JSONで同じグループ名を指定。値を揃えて渡す配線は自動生成。</text>
<path d="M26 126 H974" fill="none" stroke="#dbe3eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="26" y="150" width="435" height="122" rx="12" fill="#eaf2ff" stroke="#5782b6" stroke-width="1.3"/>
<text x="44" y="179" font-size="16" fill="#234f82" font-weight="700" text-anchor="start">入力 1：今回書き込まれた新しい値</text>
<text x="44" y="214" font-size="22" fill="#172d43" font-weight="400" text-anchor="start">分 = 42</text>
<rect x="521" y="150" width="453" height="122" rx="12" fill="#f3f6fa" stroke="#c9d4df" stroke-width="1.3"/>
<text x="539" y="179" font-size="16" fill="#172d43" font-weight="700" text-anchor="start">入力 2：書かれなかった項目はRAMから</text>
<text x="539" y="214" font-size="20" fill="#172d43" font-weight="400" text-anchor="start">2026 / 08 / 18   09 : 58 : 12</text>
<text x="539" y="244" font-size="20" fill="#172d43" font-weight="400" text-anchor="start">年・月・日・時・秒を採用</text>
<path d="M244 278 V291 H370 V309" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M748 278 V291 H630 V309" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="26" y="315" width="948" height="140" rx="12" fill="#fff7ed" stroke="#ea7b23" stroke-width="2.5"/>
<text x="44" y="344" font-size="19" fill="#994210" font-weight="700" text-anchor="start">自動生成：新しい値 ＋ RAMの現在値 → そろった値をアプリへ</text>
<rect x="44" y="361" width="136" height="77" rx="7" fill="#f3f6fa" stroke="#c9d4df" stroke-width="1"/>
<text x="58" y="384" font-size="16" fill="#172d43" font-weight="400" text-anchor="start">年</text>
<text x="112.0" y="421" font-size="28" fill="#172d43" font-weight="700" text-anchor="middle">2026</text>
<text x="168" y="383" font-size="14" fill="#172d43" font-weight="400" text-anchor="end">RAM</text>
<rect x="198" y="361" width="136" height="77" rx="7" fill="#f3f6fa" stroke="#c9d4df" stroke-width="1"/>
<text x="212" y="384" font-size="16" fill="#172d43" font-weight="400" text-anchor="start">月</text>
<text x="266.0" y="421" font-size="28" fill="#172d43" font-weight="700" text-anchor="middle">08</text>
<text x="322" y="383" font-size="14" fill="#172d43" font-weight="400" text-anchor="end">RAM</text>
<rect x="352" y="361" width="136" height="77" rx="7" fill="#f3f6fa" stroke="#c9d4df" stroke-width="1"/>
<text x="366" y="384" font-size="16" fill="#172d43" font-weight="400" text-anchor="start">日</text>
<text x="420.0" y="421" font-size="28" fill="#172d43" font-weight="700" text-anchor="middle">18</text>
<text x="476" y="383" font-size="14" fill="#172d43" font-weight="400" text-anchor="end">RAM</text>
<rect x="506" y="361" width="136" height="77" rx="7" fill="#f3f6fa" stroke="#c9d4df" stroke-width="1"/>
<text x="520" y="384" font-size="16" fill="#172d43" font-weight="400" text-anchor="start">時</text>
<text x="574.0" y="421" font-size="28" fill="#172d43" font-weight="700" text-anchor="middle">09</text>
<text x="630" y="383" font-size="14" fill="#172d43" font-weight="400" text-anchor="end">RAM</text>
<rect x="660" y="361" width="136" height="77" rx="7" fill="#eaf2ff" stroke="#5782b6" stroke-width="1"/>
<text x="674" y="384" font-size="16" fill="#234f82" font-weight="400" text-anchor="start">分</text>
<text x="728.0" y="421" font-size="28" fill="#234f82" font-weight="700" text-anchor="middle">42</text>
<text x="784" y="383" font-size="14" fill="#234f82" font-weight="400" text-anchor="end">新</text>
<rect x="814" y="361" width="136" height="77" rx="7" fill="#f3f6fa" stroke="#c9d4df" stroke-width="1"/>
<text x="828" y="384" font-size="16" fill="#172d43" font-weight="400" text-anchor="start">秒</text>
<text x="882.0" y="421" font-size="28" fill="#172d43" font-weight="700" text-anchor="middle">12</text>
<text x="938" y="383" font-size="14" fill="#172d43" font-weight="400" text-anchor="end">RAM</text>
<path d="M500 461 L500 480" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="26" y="486" width="604" height="108" rx="12" fill="#effaf3" stroke="#429269" stroke-width="1.3"/>
<text x="44" y="515" font-size="16" fill="#22613e" font-weight="700" text-anchor="start">アプリ実装：組合せの検証</text>
<text x="44" y="550" font-size="25" fill="#172d43" font-weight="400" text-anchor="start">実在する日時か？</text>
<rect x="712" y="486" width="262" height="108" rx="12" fill="#fff7ed" stroke="#ea7b23" stroke-width="2.5"/>
<text x="730" y="515" font-size="16" fill="#994210" font-weight="700" text-anchor="start">自動生成：判定結果</text>
<text x="730" y="550" font-size="24" fill="#172d43" font-weight="400" text-anchor="start">OK / NG応答</text>
<path d="M636 544 L706 544" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="26" y="626" font-size="19" fill="#526477" font-weight="400" text-anchor="start">青い値だけが今回の更新。RAMから補った値も含め、常にグループ全体を検証する。</text>
</g>
</svg>
