<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="807" viewBox="0 0 1000 807" role="img" aria-labelledby="title desc">
<title id="title">書込み時に、アプリの現在状態を問い合わせる</title>
<desc id="desc">時計編集中のMaster書込みは、自動生成が手書きの同期callbackへ問い合わせる。MB_TRUEならbusy例外0x06を返す。編集確定後の次の要求では再び問い合わせ、MB_FALSEなら正常受理する。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#738597" stroke-width="1.7"/></marker></defs>
<rect width="1000" height="100%" fill="#ffffff"/>
<g font-family="Yu Gothic UI, Meiryo, sans-serif" fill="#172d43">
<text x="26" y="32" font-size="17" fill="#526477" font-weight="400" text-anchor="start">2.3 編集中だけ書込みを拒否</text>
<text x="26" y="72" font-size="29" fill="#172d43" font-weight="700" text-anchor="start">書込み時に、アプリの現在状態を問い合わせる</text>
<text x="26" y="106" font-size="19" fill="#526477" font-weight="400" text-anchor="start">上から下へ時間が進む。拒否するのは対象の時刻レジスタ。</text>
<path d="M26 126 H974" fill="none" stroke="#dbe3eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="80" y="150" width="196" height="48" rx="12" fill="#effaf3" stroke="#429269" stroke-width="1.3"/>
<text x="178" y="181" font-size="21" fill="#22613e" font-weight="700" text-anchor="middle">アプリ実装</text>
<rect x="392" y="150" width="196" height="48" rx="12" fill="#fff7ed" stroke="#ea7b23" stroke-width="1.3"/>
<text x="490" y="181" font-size="21" fill="#994210" font-weight="700" text-anchor="middle">自動生成</text>
<rect x="704" y="150" width="196" height="48" rx="12" fill="#f3f6fa" stroke="#c9d4df" stroke-width="1.3"/>
<text x="802" y="181" font-size="21" fill="#172d43" font-weight="700" text-anchor="middle">Master</text>
<rect x="26" y="220" width="948" height="88" rx="10" fill="#edf8f2" stroke="#edf8f2" stroke-width="0"/>
<text x="44" y="250" font-size="18" fill="#22613e" font-weight="700" text-anchor="start">通常</text>
<rect x="26" y="320" width="948" height="225" rx="10" fill="#fff1f0" stroke="#fff1f0" stroke-width="0"/>
<text x="44" y="350" font-size="18" fill="#9c302c" font-weight="700" text-anchor="start">編集中</text>
<rect x="26" y="550" width="948" height="192" rx="10" fill="#edf8f2" stroke="#edf8f2" stroke-width="0"/>
<text x="44" y="581" font-size="18" fill="#22613e" font-weight="700" text-anchor="start">通常</text>
<path d="M178 204 V744" fill="none" stroke="#adb9c5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
<path d="M490 204 V744" fill="none" stroke="#adb9c5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
<path d="M802 204 V744" fill="none" stroke="#adb9c5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
<path d="M178 252 H257 V283 H178" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="278" y="274" font-size="20" fill="#172d43" font-weight="400" text-anchor="start">① 時計編集画面へ</text>
<text x="334.0" y="363" font-size="19" fill="#22613e" font-weight="400" text-anchor="middle">③ BUSY問い合わせ</text>
<path d="M490 376 L178 376" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="334" y="402" font-size="19" fill="#22613e" text-anchor="middle">MB_TRUE</text>
<path d="M178 414 L490 414" fill="none" stroke="#738597" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="646.0" y="325" font-size="19" fill="#172d43" font-weight="400" text-anchor="middle">② 時刻を書込み</text>
<path d="M802 338 L490 338" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="646.0" y="474" font-size="19" fill="#9c302c" font-weight="400" text-anchor="middle">0x06：書込み拒否</text>
<path d="M490 487 L802 487" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M178 513 H257 V544 H178" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="278" y="538" font-size="20" fill="#172d43" font-weight="400" text-anchor="start">④ 時計編集を確定</text>
<text x="334.0" y="587" font-size="19" fill="#22613e" font-weight="400" text-anchor="middle">⑥ BUSY問い合わせ</text>
<path d="M490 600 L178 600" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="334" y="638" font-size="19" fill="#22613e" text-anchor="middle">MB_FALSE</text>
<path d="M178 650 L490 650" fill="none" stroke="#738597" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="646.0" y="556" font-size="19" fill="#172d43" font-weight="400" text-anchor="middle">⑤ 時刻を書込み</text>
<path d="M802 569 L490 569" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="646.0" y="713" font-size="19" fill="#22613e" font-weight="400" text-anchor="middle">OK：正常受理</text>
<path d="M490 726 L802 726" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="26" y="782" font-size="19" fill="#526477" font-weight="400" text-anchor="start">BUSY状態は手書き側で判断。自動生成は書込み前に同期で問い合わせ、例外応答を返す。</text>
</g>
</svg>
