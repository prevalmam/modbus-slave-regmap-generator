<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
<title id="title">6つの値を、1つの日時として判定する</title>
<desc id="desc">Masterが2026/08/18 09:58:12を一括書込みする。生成コードが6項目を集め、実在する日時かをアプリが検証する。結果に応じてOKまたはNG応答を返す。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#738597" stroke-width="1.7"/></marker></defs>
<rect width="1000" height="100%" fill="#ffffff"/>
<g font-family="Yu Gothic UI, Meiryo, sans-serif" fill="#172d43">
<text x="26" y="32" font-size="17" fill="#526477" font-weight="400" text-anchor="start">2.6 グループ検証</text>
<text x="26" y="72" font-size="29" fill="#172d43" font-weight="700" text-anchor="start">6つの値を、1つの日時として判定する</text>
<text x="26" y="106" font-size="19" fill="#526477" font-weight="400" text-anchor="start">同じグループ名をExcelで指定。値を揃えて渡す配線は自動生成。</text>
<path d="M26 126 H974" fill="none" stroke="#dbe3eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="26" y="150" width="948" height="122" rx="12" fill="#eaf2ff" stroke="#5782b6" stroke-width="1.3"/>
<text x="44" y="179" font-size="16" fill="#234f82" font-weight="700" text-anchor="start">入力：Masterから一括書込み（Write Multiple Registers）</text>
<text x="44" y="214" font-size="25" fill="#172d43" font-weight="400" text-anchor="start">2026 / 08 / 18   09 : 58 : 12</text>
<path d="M500 278 L500 309" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="26" y="315" width="948" height="140" rx="12" fill="#fff7ed" stroke="#ea7b23" stroke-width="2.5"/>
<text x="44" y="344" font-size="19" fill="#994210" font-weight="700" text-anchor="start">自動生成：グループ内の値を収集 → そろった値をアプリへ</text>
<rect x="44" y="361" width="136" height="77" rx="7" fill="#eaf2ff" stroke="#5782b6" stroke-width="1"/>
<text x="58" y="384" font-size="16" fill="#234f82" font-weight="400" text-anchor="start">年</text>
<text x="112.0" y="421" font-size="28" fill="#234f82" font-weight="700" text-anchor="middle">2026</text>
<rect x="198" y="361" width="136" height="77" rx="7" fill="#eaf2ff" stroke="#5782b6" stroke-width="1"/>
<text x="212" y="384" font-size="16" fill="#234f82" font-weight="400" text-anchor="start">月</text>
<text x="266.0" y="421" font-size="28" fill="#234f82" font-weight="700" text-anchor="middle">08</text>
<rect x="352" y="361" width="136" height="77" rx="7" fill="#eaf2ff" stroke="#5782b6" stroke-width="1"/>
<text x="366" y="384" font-size="16" fill="#234f82" font-weight="400" text-anchor="start">日</text>
<text x="420.0" y="421" font-size="28" fill="#234f82" font-weight="700" text-anchor="middle">18</text>
<rect x="506" y="361" width="136" height="77" rx="7" fill="#eaf2ff" stroke="#5782b6" stroke-width="1"/>
<text x="520" y="384" font-size="16" fill="#234f82" font-weight="400" text-anchor="start">時</text>
<text x="574.0" y="421" font-size="28" fill="#234f82" font-weight="700" text-anchor="middle">09</text>
<rect x="660" y="361" width="136" height="77" rx="7" fill="#eaf2ff" stroke="#5782b6" stroke-width="1"/>
<text x="674" y="384" font-size="16" fill="#234f82" font-weight="400" text-anchor="start">分</text>
<text x="728.0" y="421" font-size="28" fill="#234f82" font-weight="700" text-anchor="middle">58</text>
<rect x="814" y="361" width="136" height="77" rx="7" fill="#eaf2ff" stroke="#5782b6" stroke-width="1"/>
<text x="828" y="384" font-size="16" fill="#234f82" font-weight="400" text-anchor="start">秒</text>
<text x="882.0" y="421" font-size="28" fill="#234f82" font-weight="700" text-anchor="middle">12</text>
<path d="M500 461 L500 480" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="26" y="486" width="604" height="108" rx="12" fill="#effaf3" stroke="#429269" stroke-width="1.3"/>
<text x="44" y="515" font-size="16" fill="#22613e" font-weight="700" text-anchor="start">アプリ実装：組合せの検証</text>
<text x="44" y="550" font-size="25" fill="#172d43" font-weight="400" text-anchor="start">実在する日時か？</text>
<rect x="712" y="486" width="262" height="108" rx="12" fill="#fff7ed" stroke="#ea7b23" stroke-width="2.5"/>
<text x="730" y="515" font-size="16" fill="#994210" font-weight="700" text-anchor="start">自動生成：判定結果</text>
<text x="730" y="550" font-size="24" fill="#172d43" font-weight="400" text-anchor="start">OK / NG応答</text>
<path d="M636 544 L706 544" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="26" y="626" font-size="19" fill="#526477" font-weight="400" text-anchor="start">例：2月30日は各項目の範囲内でも不成立。年・月・日を組み合わせて判定する。</text>
</g>
</svg>
