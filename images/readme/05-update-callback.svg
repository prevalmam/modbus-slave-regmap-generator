<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">入口が2つあっても、RTCへの処理は1つ</title>
<desc id="desc">Masterの時刻書込みと、実機の画面・操作キーで確定したset_current_timeによる更新が、同じユーザーコールバックへ合流する。自動生成コードが通知し、アプリがRTCへ書き込む。source引数でMaster writeと内部setterを区別できる。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#738597" stroke-width="1.7"/></marker></defs>
<rect width="1000" height="100%" fill="#ffffff"/>
<g font-family="Yu Gothic UI, Meiryo, sans-serif" fill="#172d43">
<text x="26" y="32" font-size="17" fill="#526477" font-weight="400" text-anchor="start">2.4 書込み後の処理を共通化</text>
<text x="26" y="72" font-size="29" fill="#172d43" font-weight="700" text-anchor="start">入口が2つあっても、RTCへの処理は1つ</text>
<text x="26" y="106" font-size="19" fill="#526477" font-weight="400" text-anchor="start">Masterからの書込みと内部setterの成立後、同じユーザーコールバックへ。</text>
<path d="M26 126 H974" fill="none" stroke="#dbe3eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="26" y="158" width="286" height="122" rx="12" fill="#f3f6fa" stroke="#c9d4df" stroke-width="1.3"/>
<text x="44" y="187" font-size="16" fill="#172d43" font-weight="700" text-anchor="start">入口 1：Master</text>
<text x="44" y="222" font-size="20" fill="#172d43" font-weight="400" text-anchor="start">Modbusで時刻を書込み</text>
<rect x="26" y="315" width="286" height="144" rx="12" fill="#effaf3" stroke="#429269" stroke-width="1.3"/>
<text x="44" y="344" font-size="16" fill="#22613e" font-weight="700" text-anchor="start">入口 2：画面・操作キー</text>
<text x="44" y="379" font-size="20" fill="#172d43" font-weight="400" text-anchor="start">時刻合わせを確定</text>
<text x="44" y="409" font-size="20" fill="#172d43" font-weight="400" text-anchor="start">set_current_time()</text>
<rect x="390" y="233" width="310" height="184" rx="12" fill="#fff7ed" stroke="#ea7b23" stroke-width="2.5"/>
<text x="408" y="262" font-size="16" fill="#994210" font-weight="700" text-anchor="start">自動生成：更新通知</text>
<text x="408" y="297" font-size="22" fill="#172d43" font-weight="400" text-anchor="start">同じユーザー</text>
<text x="408" y="327" font-size="22" fill="#172d43" font-weight="400" text-anchor="start">コールバックを呼ぶ</text>
<text x="408" y="357" font-size="22" fill="#172d43" font-weight="400" text-anchor="start">sourceで入口を区別</text>
<path d="M318 219 H349 V291 H384" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M318 387 H349 V357 H384" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="766" y="252" width="208" height="144" rx="12" fill="#effaf3" stroke="#429269" stroke-width="1.3"/>
<text x="784" y="281" font-size="16" fill="#22613e" font-weight="700" text-anchor="start">アプリ実装</text>
<text x="784" y="316" font-size="22" fill="#172d43" font-weight="400" text-anchor="start">RTCへ実際に</text>
<text x="784" y="346" font-size="22" fill="#172d43" font-weight="400" text-anchor="start">書き込む</text>
<path d="M706 325 L760 325" fill="none" stroke="#738597" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="26" y="495" font-size="19" fill="#526477" font-weight="400" text-anchor="start">呼出し元を区別する必要があるときだけ、コールバックの source を参照する。</text>
</g>
</svg>
